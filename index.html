<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cari Link</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f5f5f7;color:#111}
  .box{max-width:560px;margin:0 auto}
  h1{font-size:1.3rem}
  .row{display:flex;gap:8px}
  input{flex:1;font-size:1.2rem;padding:12px;border:1px solid #ccc;border-radius:10px}
  button{font-size:1rem;padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff}
  button.copy{background:#16a34a;width:100%;margin-top:10px}
  #hasil{margin-top:16px;padding:14px;background:#fff;border-radius:10px;display:none;word-break:break-all}
  .tap{padding:14px;border:2px dashed #2563eb;border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .tap.done{border-color:#16a34a;background:#f0fdf4}
  .status{margin-top:8px;font-size:.9rem;font-weight:600;color:#16a34a}
  .buka{display:block;margin-top:10px;text-align:center;color:#2563eb}
  .err{color:#b91c1c}
  small{color:#666}
  .item{margin-bottom:14px}
  .item small{display:block;margin-bottom:4px}
  button.all{background:#7c3aed;width:100%;margin-bottom:14px}
</style>
</head>
<body>
<div class="box">
  <h1>Cari link berdasarkan nomor</h1>
  <div class="row">
    <input id="q" type="text" inputmode="numeric" placeholder="Contoh: 501" autofocus>
    <button id="cari">Cari</button>
  </div>
  <div id="hasil"></div>
  <p><small id="info">Memuat data...</small></p>
</div>

<script>
const data = new Map();
const q = document.getElementById('q');
const hasil = document.getElementById('hasil');

function parseCSV(text){
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
      else if (c === '"') inQ = false;
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',' ){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

// Pecah teks yang isinya beberapa link menempel jadi satu (https://...https://...)
function pecahLink(teks){
  return teks.split(/(?=https?:\/\/)/i)
    .map(x => x.replace(/[\s,;]+$/, '').trim())   // buang spasi/koma/titik koma di ujung
    .filter(x => /^https?:\/\//i.test(x));
}

// Baca sebagai UTF-8; kalau gagal (file dari Excel/Windows) pakai windows-1252
function dekode(buf){
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}

async function muatCSV(){
  for (const nama of ['hasil.csv', 'data.csv']){
    try {
      const r = await fetch(nama);
      if (!r.ok) continue;
      return dekode(await r.arrayBuffer());
    } catch(e){}
  }
  throw new Error('csv tidak ditemukan');
}

muatCSV().then(t => {
  parseCSV(t.replace(/^\uFEFF/, '')).forEach(r => {
    const key = (r[0] || '').trim();
    if (!key || r.length < 2) return;
    data.set(key, pecahLink(r.slice(1).join(',')));
  });
  document.getElementById('info').textContent = data.size + ' data dimuat.';
}).catch(() => {
  document.getElementById('info').textContent = 'Gagal memuat hasil.csv';
});

async function salinTeks(link){
  try { await navigator.clipboard.writeText(link); return true; }
  catch(e){
    const t = document.createElement('textarea');
    t.value = link; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.focus(); t.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(_){}
    t.remove();
    return ok;
  }
}

function cari(){
  const key = q.value.trim();
  hasil.style.display = 'block';
  if (!key){ hasil.innerHTML = '<span class="err">Isi nomor dulu.</span>'; return; }
  const links = data.get(key) ?? data.get(String(parseInt(key, 10)));
  const aman = key.replace(/</g,'&lt;');
  if (!links){ hasil.innerHTML = '<span class="err">Nomor ' + aman + ' tidak ditemukan.</span>'; return; }
  if (!links.length){ hasil.innerHTML = '<span class="err">Nomor ' + aman + ' ada, tapi link-nya kosong.</span>'; return; }
  hasil.innerHTML = '';

  const salinan = [];

  if (links.length > 1){
    const all = document.createElement('button');
    all.className = 'all';
    all.textContent = 'Salin semua seperti di CSV (' + links.length + ' link)';
    all.onclick = async () => {
      const ok = await salinTeks(links.join(''));
      all.textContent = ok ? '✓ Semua tersalin' : 'Gagal menyalin';
    };
    hasil.append(all);
  }

  links.forEach((link, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'item';

    const judul = document.createElement('small');
    judul.textContent = 'Link ' + (i + 1) + (/\/\/s\.shopee\./.test(link) ? ' (pendek)' : '');

    const tap = document.createElement('div');
    tap.className = 'tap';
    const teks = document.createElement('div');
    teks.textContent = link;
    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = 'Ketuk kotak ini untuk menyalin';
    tap.append(teks, status);

    const salin = async () => {
      const ok = await salinTeks(link);
      status.textContent = ok ? '✓ Tersalin' : 'Gagal menyalin, coba ketuk lagi';
      tap.classList.toggle('done', ok);
    };
    tap.onclick = salin;
    salinan.push(salin);

    const buka = document.createElement('a');
    buka.href = link; buka.target = '_blank'; buka.rel = 'noopener';
    buka.className = 'buka'; buka.textContent = 'Buka link';

    wrap.append(judul, tap, buka);
    hasil.append(wrap);
  });

  salinTeks(links.join('')).then(ok => {
    const b = hasil.querySelector('button.all');
    if (b) b.textContent = ok ? '✓ Semua tersalin (' + links.length + ' link)' : 'Gagal menyalin, ketuk di sini';
    else if (ok) { const st = hasil.querySelector('.status'); const tp = hasil.querySelector('.tap'); if (st) st.textContent = '✓ Tersalin'; if (tp) tp.classList.add('done'); }
  }); // semua link otomatis tersalin (sama persis seperti isi CSV) saat Cari ditekan
}

document.getElementById('cari').onclick = cari;
q.addEventListener('keydown', e => { if (e.key === 'Enter') cari(); });
</script>
</body>
</html>
